<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zystra VPN — Legal</title>
<style>
  :root { --bg:#0b0f17; --card:#121826; --text:#e6edf7; --muted:#9fb0c9;
          --accent:#3ea6ff; --border:#1f2a3d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         Helvetica,Arial,sans-serif; padding:24px; }
  .card { max-width:520px; width:100%; background:var(--card);
          border:1px solid var(--border); border-radius:18px;
          padding:34px 28px; text-align:center; }
  .logo { width:96px; height:96px; border-radius:22px; margin-bottom:16px; }
  h1 { font-size:26px; margin:6px 0 10px; }
  p { color:var(--muted); line-height:1.6; margin:0 0 26px; }
  a.btn { display:inline-block; background:var(--accent); color:#04101f;
          font-weight:700; text-decoration:none; padding:14px 26px;
          border-radius:12px; }
  footer { margin-top:26px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/logo.png" alt="Zystra VPN logo" />
    <h1>Zystra VPN</h1>
    <p>Legal information for the Zystra VPN mobile application.</p>
    <a class="btn" href="privacy.html">Read the Privacy Policy</a>
    <footer>&copy; 2026 Across Cloud LLC</footer>
  </main>
</body>
</html>
